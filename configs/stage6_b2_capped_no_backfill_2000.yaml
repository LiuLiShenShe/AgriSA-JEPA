# Stage 6 / B2 -- physical-source capped (no backfill) arm
#
# Same controlled protocol as B1; only the exposure policy changes.
#
#   sampling        : Stage 5E.1 formal `by_source` profile
#                     cap_unit         = physical_source_id
#                     epoch_length     = 150,000
#                     cap_share        = 0.5  -> cap = 75,000 exposures
#                     capped source    = artemis_imagesafari
#                     backfill         = false
#
# IMPORTANT: because surplus exposure is NOT redistributed, the capped epoch
# emits ~111,171.64 exposures, not 150,000.  The capped source therefore holds
# 75,000 / 111,171.64 = 67.46% of *emitted* samples per epoch, which is NOT
# "50% of emitted samples".  realised counts are recorded per run by the
# source-exposure ledger and reported from that ledger, never inferred from
# this config.
#
# The sampler realises the fractional profile as a deterministic integer epoch
# (largest-remainder apportionment + smooth weighted round-robin); see
# src/datasets/stage6_sampling.py for the exact construction.
meta:
  stage: stage6_controlled_pretraining
  arm: B2
  arm_label: capped_no_backfill
  model_name: vit_huge
  patch_size: 14
  pred_depth: 12
  pred_emb_dim: 384
  load_checkpoint: false
  read_checkpoint: null
  pretrained_checkpoint: /data/checkpoints/ijepa/IN1K-vit.h.14-300e.pth.tar
  pretrained_sha256: 0382013c481743e9ccea89f970bc6c6aa126aa19a62127500d6e672a641aae22
  copy_data: false
  use_bfloat16: true
  use_sdpa: true
  activation_checkpointing: false
data:
  dataset: agrifield40k
  manifest: data/stage6/stage6_r3v3_train_view_nvme.csv
  manifest_sha256: 26c55431c63791d4f7d427d432840c21aa47a717a5daadbb5990a68a546f71f2
  split: train
  seed: 20261026
  augmentation_seed: 20261026
  batch_size: 16
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: .
  image_cache_dir: null
  num_workers: 0
  pin_mem: true
  root_path: null
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  max_samples: null
  sampling:
    mode: profile_capped
    profile: data/corpus_v4/R3v3_license_verified_sampling_profiles.json
    profile_sha256: 91fb23ef5366fa163264a48cdf7c6613769816df751a9695ea9caa284833c505
    official_profile: by_source
    cap_unit: physical_source_id
    epoch_length: 150000
    cap_share: 0.5
    capped_sources:
    - artemis_imagesafari
    backfill: false
    seed: 20261026
  record_source_exposure: true
mask:
  mode: random
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 24
  stop_after_epoch: null
  max_optimizer_steps: 2000
  save_at_optimizer_steps:
  - 500
  - 1000
  - 1500
  - 2000
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0002
  start_lr: 1.0e-05
  warmup: 0.05
  warmup_steps: 100
  weight_decay: 0.04
  grad_accum: 8
logging:
  folder: runs/stage6_b2_capped_no_backfill_2000
  write_tag: jepa
