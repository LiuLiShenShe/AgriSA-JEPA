# Stage 5C candidate -- Field-D1 continued pretraining (NOT YET RUN)
#
# This file is a *candidate* configuration produced by Stage 5B.  It has not
# been used for a long run: Stage 5B only permits a data/model input smoke test.
#
# Every field that is not data-related is copied verbatim from
# configs/stage3b_random_2000.yaml so that a future Stage 5C comparison differs
# only in the training corpus and sampling strategy.
#
# Flags that must be resolved before launching:
#   * data.manifest_sha256 -- recompute after the Field-D1 version is frozen;
#   * data.image_cache_dir -- build with tools/build_image_cache.py for the new
#     manifest (the v1 cache does not match);
#   * logging.folder        -- a new directory, never an existing run.
meta:
  stage: stage5c_field_jepa_candidate
  arm: B1
  arm_label: field_d1_natural
  model_name: vit_huge
  patch_size: 14
  pred_depth: 12
  pred_emb_dim: 384
  load_checkpoint: false
  read_checkpoint: null
  pretrained_checkpoint: /data/checkpoints/ijepa/IN1K-vit.h.14-300e.pth.tar
  pretrained_sha256: 0382013c481743e9ccea89f970bc6c6aa126aa19a62127500d6e672a641aae22
  copy_data: false
  use_bfloat16: true
  use_sdpa: true
  activation_checkpointing: false
data:
  dataset: agrifield40k
  manifest: data/frozen/agri-field-d1-candidate_train.csv
  # CANDIDATE version: do not freeze the hash into a paper until the version is
  # promoted.  The value below is the candidate build recorded on 2026-10-23.
  manifest_sha256: 6ba4ba172f09c7d6d38ac7d2ae771400af2f4ae6bb74b57e8ca401023c6ae437
  split: train
  seed: 20261023
  augmentation_seed: 20261023
  batch_size: 16
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: .
  # Must be rebuilt for this manifest; the v1 cache is keyed by manifest SHA-256
  # and the dataset refuses a mismatched cache.
  image_cache_dir: null
  num_workers: 0
  pin_mem: true
  root_path: /data/datasets/AgriField-40K
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  max_samples: null
  # Sampling strategy is a property of the corpus, not of the mask collator.
  # Allowed values: natural | source_balanced | source_capped.
  # Only "natural" is wired into the loader today; the other two are planned
  # Stage 5C work, so this file must not be launched with them until that code
  # exists.
  sampling: natural
mask:
  mode: random
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 300
  stop_after_epoch: null
  max_optimizer_steps: 2000
  save_at_optimizer_steps:
  - 500
  - 1000
  - 1500
  - 2000
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0002
  start_lr: 1.0e-05
  warmup: 0.05
  weight_decay: 0.04
  grad_accum: 8
logging:
  folder: /home/test/agrisa_runs/stage5c_field_d1_b1
  write_tag: jepa
