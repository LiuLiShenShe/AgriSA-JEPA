# Stage 4B -- G0: geometry control with NO structure prior
#
# Candidate block sampling with the overlap penalty but no agricultural prior.
#   score_mode: uniform  -> candidate scores are i.i.d. uniform (the prior is
#                           never computed or read; the structure term is 0)
#   guidance_lambda: 0.0 -> structure term disabled
#   geometry_beta: 3.5   -> overlap penalty shared with G1/G2/G3
#
# 2,000-update SCHEDULE, interrupted after 500 updates.  The learning-rate,
# weight-decay and EMA trajectories therefore end at the same place as the
# existing B_500 mid-schedule checkpoint; max_optimizer_steps is deliberately
# NOT reduced to 500, which would change those trajectories.

