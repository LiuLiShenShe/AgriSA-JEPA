# Stage 6 / B1 -- natural exposure arm
#
# Controlled agricultural continued pretraining on the frozen Stage 5E.1
# R3v3 train split, initialised from the official I-JEPA ViT-H/14 ImageNet
# checkpoint.
#
#   backbone        : official I-JEPA ViT-H/14 (IN1K-vit.h.14-300e.pth.tar)
#   data            : Stage 6 derived view of R3v3_license_verified train
#                     (147,277 rows; val never participates in updates)
#   sampling        : NATURAL -- exposure proportional to the manifest
#                     distribution of `physical_source_id`
#   budget          : 2,000 optimizer updates, effective batch 128
#   mask            : official random multi-block (untouched upstream collator)
#
# B1 and B2 differ ONLY in meta.arm / meta.arm_label, data.sampling and
# logging.folder. tools/check_stage6_protocol.py asserts that mechanically.
# Both arms start from the SAME official checkpoint and are trained
# independently -- B2 is never chained onto B1.
#
# warmup_steps is an absolute update count (5% of the 2,000-update horizon) so
# the two arms have identical LR/WD trajectories even though their epochs hold
# different numbers of updates (natural vs capped emission lengths).
meta:
  stage: stage6_controlled_pretraining
  arm: B1
  arm_label: natural
  model_name: vit_huge
  patch_size: 14
  pred_depth: 12
  pred_emb_dim: 384
  load_checkpoint: false
  read_checkpoint: null
  pretrained_checkpoint: /data/checkpoints/ijepa/IN1K-vit.h.14-300e.pth.tar
  pretrained_sha256: 0382013c481743e9ccea89f970bc6c6aa126aa19a62127500d6e672a641aae22
  copy_data: false
  use_bfloat16: true
  use_sdpa: true
  activation_checkpointing: false
data:
  dataset: agrifield40k
  manifest: data/stage6/stage6_r3v3_train_view_nvme.csv
  manifest_sha256: 26c55431c63791d4f7d427d432840c21aa47a717a5daadbb5990a68a546f71f2
  split: train
  seed: 20261026
  augmentation_seed: 20261026
  batch_size: 16
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: .
  image_cache_dir: null
  num_workers: 0
  pin_mem: true
  root_path: null
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  max_samples: null
  sampling:
    mode: natural
  record_source_exposure: true
mask:
  mode: random
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 24
  stop_after_epoch: null
  max_optimizer_steps: 2000
  save_at_optimizer_steps:
  - 500
  - 1000
  - 1500
  - 2000
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0002
  start_lr: 1.0e-05
  warmup: 0.05
  warmup_steps: 100
  weight_decay: 0.04
  grad_accum: 8
logging:
  folder: runs/stage6_b1_natural_2000
  write_tag: jepa
