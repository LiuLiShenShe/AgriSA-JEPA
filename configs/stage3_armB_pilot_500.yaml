# Stage 3 Arm B candidate — official I-JEPA ViT-H/14 continued pretraining on
# the frozen PROVISIONAL exploratory corpus agrifield40k-v0.
#
# DIFFERENCES FROM THE stage3_baseline_candidate.yaml THIS FILE SUPERSEDES:
#   1. data.manifest points at the versioned frozen manifest, not the Stage 1
#      `pretrain_manifest.csv`. Its SHA-256 is computed at load time and
#      re-verified on resume, so a silent data change cannot slip in.
#   2. batch_size 16 / grad_accum 8 (the measured best throughput/VRAM trade-off
#      on one A6000) instead of batch_size 1 / grad_accum 256. With batch 1,
#      grad_accum 256 would have meant 256 micro-steps per update — unmeasured,
#      and at the measured ~135 ms per micro-step that is ~34 s per update.
#   3. `max_optimizer_steps: 500` is the exact update budget. `epochs: 5` is
#      only the outer loop; the budget stops training at update 500 even
#      mid-epoch and the run FAILS if the recorded count does not match.
#   4. LR/WD/EMA decay over the budget horizon, so final_lr/final_weight_decay
#      are reached exactly at update 500, not at an unrelated epoch-derived count.
#
# 500 updates is a PILOT. The full Stage 3 candidate budget (30,000 updates) is
# NOT run here and must not be launched from this file.

meta:
  model_name: vit_huge
  patch_size: 14
  pred_depth: 12
  pred_emb_dim: 384
  load_checkpoint: false
  read_checkpoint: null
  pretrained_checkpoint: /data/checkpoints/ijepa/IN1K-vit.h.14-300e.pth.tar
  pretrained_sha256: 0382013c481743e9ccea89f970bc6c6aa126aa19a62127500d6e672a641aae22
  copy_data: false
  use_bfloat16: true
  use_sdpa: true
  activation_checkpointing: false
data:
  dataset: agrifield40k
  # PROVISIONAL frozen exploratory corpus (sha256 recorded in data/frozen/freeze_manifest.json)
  manifest: data/frozen/agrifield40k-v0_train.csv
  split: train
  seed: 20261019
  batch_size: 16
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: .
  num_workers: 6
  pin_mem: true
  root_path: /data/datasets/AgriField-40K
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  max_samples: null
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
optimization:
  ema:
  - 0.996
  - 1.0
  # 12,447 images / batch 16 = 777 micro-steps per epoch, drop_last; with
  # grad_accum 8 that is ceil(777/8) = 98 optimizer updates per epoch.
  # 6 epochs give 588 updates of headroom so the 500-update budget is reached
  # with about 5.1 passes over the corpus; the budget stop lands mid-epoch 6.
  epochs: 6
  stop_after_epoch: null
  max_optimizer_steps: 500
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  # continued-pretraining LR, not the from-scratch 2e-3
  lr: 0.0002
  start_lr: 1.0e-05
  warmup: 0.05
  weight_decay: 0.04
  grad_accum: 8
logging:
  folder: runs/stage3_armB_pilot_500
  write_tag: jepa
