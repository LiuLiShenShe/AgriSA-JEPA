# Stage 2C resume-consistency test, arm C: resume arm B to the full 10 updates.
#
# Same config as arm B, but `load_checkpoint: true` and `read_checkpoint` points
# at arm B's checkpoint (resolved relative to this config's `logging.folder`).
# It must therefore live in `runs/stage2c_resume_resumed/`, i.e. one level below
# `runs/`, because arm B writes to `runs/stage2c_resume_interrupted/`.
#
# `num_workers: 0` keeps the augmentation RNG in-process, which is what makes a
# bit-for-bit comparison meaningful at all (a multi-worker loader would consume
# RNG inside worker processes that cannot be checkpointed, so exact equality is
# not achievable there). Evidence: reports/stage2c_resume_consistency.md
meta:
  model_name: vit_huge
  patch_size: 14
  pred_depth: 12
  pred_emb_dim: 384
  load_checkpoint: true
  read_checkpoint: ../stage2c_resume_interrupted/jepa-latest.pth.tar
  pretrained_checkpoint: /data/checkpoints/ijepa/IN1K-vit.h.14-300e.pth.tar
  pretrained_sha256: 0382013c481743e9ccea89f970bc6c6aa126aa19a62127500d6e672a641aae22
  copy_data: false
  use_bfloat16: true
  use_sdpa: true
  activation_checkpointing: false
data:
  dataset: agrifield40k
  manifest: data/frozen/agrifield40k-v0_train.csv
  split: train
  seed: 20261019
  batch_size: 8
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: .
  num_workers: 0
  pin_mem: false
  root_path: /data/datasets/AgriField-40K
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  max_samples: 64
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 12
  stop_after_epoch: null
  max_optimizer_steps: 10
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0002
  start_lr: 1.0e-05
  warmup: 0.05
  weight_decay: 0.04
  grad_accum: 4
logging:
  folder: runs/stage2c_resume_resumed
  write_tag: jepa
