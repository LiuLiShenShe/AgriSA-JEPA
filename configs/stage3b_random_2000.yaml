#   budget              : 2000 optimizer updates, effective batch 128
#   mask strategy       : official random multi-block (untouched upstream collator)
#
# EVERY field except the mask strategy and the arm-identifying metadata is
# identical across the four configs; tools/check_stage3b4a_protocol.py asserts
# that mechanically.  All four arms start from the SAME official checkpoint and
# are trained independently -- no arm is chained onto another arm's weights.
#
# The mask collator is the unmodified upstream MaskCollator.
# This arm is the control the three structure-guided arms are
# compared against.
