# Stage 3B / Stage 4A -- vegetation_guided
#
# Arm C1 of the agricultural continued-pretraining comparison.
#   backbone            : official I-JEPA ViT-H/14 (IN1K-vit.h.14-300e.pth.tar)
#   data                : data/frozen/agrifield40k-v1_train.csv (PROVISIONAL, 12,567)
#   budget              : 2000 optimizer updates, effective batch 128
#   mask strategy       : C1 -- candidate-block sampling weighted by ExG vegetation saliency
#
# EVERY field except the mask strategy and the arm-identifying metadata is
# identical across the four configs; tools/check_stage3b4a_protocol.py asserts
# that mechanically.  All four arms start from the SAME official checkpoint and
# are trained independently -- no arm is chained onto another arm's weights.
#
# C1: the prior is Excess Green (2G - R - B) on the augmented crop,
# robustly normalised per image and mean-pooled onto the 16x16
# patch grid.  It is used ONLY to weight target-block positions.
meta:
  stage: stage3b_stage4a_agricultural_continued_pretraining
  arm: C1
  arm_label: vegetation_guided
  model_name: vit_huge
  patch_size: 14
  pred_depth: 12
  pred_emb_dim: 384
  load_checkpoint: false
  read_checkpoint: null
  pretrained_checkpoint: /data/checkpoints/ijepa/IN1K-vit.h.14-300e.pth.tar
  pretrained_sha256: 0382013c481743e9ccea89f970bc6c6aa126aa19a62127500d6e672a641aae22
  copy_data: false
  use_bfloat16: true
  use_sdpa: true
  activation_checkpointing: false
data:
  dataset: agrifield40k
  manifest: data/frozen/agrifield40k-v1_train.csv
  manifest_sha256: d63183af8ede53bc859474d1fc82cc969335c71967008812a485de10476a5435
  split: train
  seed: 20261019
  augmentation_seed: 20261019
  batch_size: 16
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: .
  num_workers: 0
  pin_mem: true
  root_path: /data/datasets/AgriField-40K
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  max_samples: null
mask:
  mode: structure_guided
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
  prior_mode: vegetation
  guidance_lambda: 6.0
  num_candidates: 16
  base_seed: 20261019
  boundary_edge_weight: 0.5
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 24
  stop_after_epoch: null
  max_optimizer_steps: 2000
  save_at_optimizer_steps:
  - 500
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0002
  start_lr: 1.0e-05
  warmup: 0.05
  weight_decay: 0.04
  grad_accum: 8
logging:
  folder: /data/agrisa_jepa_runs/stage4a_vegetation_2000
  write_tag: jepa
