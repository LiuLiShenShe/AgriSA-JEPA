data:
  dataset: agrifield40k
  manifest: pretrain_manifest.csv
  split: train
  seed: 20261017
  max_samples: 40
  batch_size: 4
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: .
  num_workers: 2
  pin_mem: true
  root_path: /data/datasets/AgriField-40K
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
logging:
  folder: runs/original_smoke_final
  write_tag: jepa
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
  - 0.15
  - 0.2
meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  read_checkpoint: null
  use_bfloat16: true
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 2
  stop_after_epoch: 1
  final_lr: 1.0e-6
  final_weight_decay: 0.04
  ipe_scale: 1.0
  lr: 1.0e-4
  start_lr: 1.0e-4
  warmup: 0
  weight_decay: 0.04
