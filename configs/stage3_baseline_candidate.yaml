# Stage 3 baseline candidate — Arm B (official I-JEPA ViT-H/14 continued
# pretraining on agricultural data).
#
# This file is the FULL-budget candidate. It is a planning artefact: it is NOT
# executed in Stage 2C and must not be launched as a wall-clock experiment
# without a separate budget decision. The runnable 500-update pilot lives in
# `configs/stage3_armB_pilot_500.yaml`.
#
# Superseded values and why (Stage 2C re-validation):
#   - manifest `pretrain_manifest.csv` -> the versioned frozen manifest. The old
#     path pointed at the Stage 1 pre-audit list, which still contains 14,743
#     `pending_audit` rows; training from it would use unaudited images.
#   - batch_size 1 / grad_accum 256 -> 16 / 8. Measured on one A6000: batch 16
#     gives 63.5 img/s at 22 GB; batch 1 / accum 256 was never measured and
#     implies ~34 s per optimizer update.
#   - epochs 1 (uncontrolled) -> an explicit `max_optimizer_steps` budget, which
#     is what actually bounds the run and is asserted at the end.
meta:
  model_name: vit_huge
  patch_size: 14
  pred_depth: 12
  pred_emb_dim: 384
  load_checkpoint: false
  read_checkpoint: null
  pretrained_checkpoint: /data/checkpoints/ijepa/IN1K-vit.h.14-300e.pth.tar
  pretrained_sha256: 0382013c481743e9ccea89f970bc6c6aa126aa19a62127500d6e672a641aae22
  copy_data: false
  use_bfloat16: true
  use_sdpa: true
  activation_checkpointing: false
data:
  dataset: agrifield40k
  # versioned PROVISIONAL frozen corpus; sha256 in data/frozen/freeze_manifest.json
  manifest: data/frozen/agrifield40k-v0_train.csv
  split: train
  seed: 20261019
  batch_size: 16
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: .
  num_workers: 6
  pin_mem: true
  root_path: /data/datasets/AgriField-40K
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  max_samples: null
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
optimization:
  ema:
  - 0.996
  - 1.0
  # outer-loop epoch count only; max_optimizer_steps is the real bound.
  # 30,000 updates at 98 updates/epoch is ~306 epochs of the frozen corpus.
  epochs: 320
  stop_after_epoch: null
  # CANDIDATE full budget — NOT executed in Stage 2C
  max_optimizer_steps: 30000
  warmup: 0.05
  start_lr: 1.0e-05
  lr: 0.0002
  final_lr: 1.0e-06
  weight_decay: 0.04
  final_weight_decay: 0.4
  ipe_scale: 1.0
  grad_accum: 8
logging:
  folder: runs/stage3_armB_candidate
  write_tag: jepa
